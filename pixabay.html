<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixabay 이미지 슬라이드</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Malgun Gothic", sans-serif; background: #f4f6f8; color: #222; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.4rem; }
  form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  input { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  #apiKey { flex: 1 1 100%; }
  #query { flex: 1 1 200px; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2f80ed; color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { background: #9bb; cursor: default; }
  #status { min-height: 1.4em; margin: 8px 0; color: #555; }
  .slider { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; display: none; }
  .slider.on { display: block; }
  .track { display: flex; height: 100%; transition: transform .4s ease; }
  .slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .slide span { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px; background: rgba(0,0,0,.55); color: #fff; font-size: .85rem; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; padding: 0; border-radius: 50%; background: rgba(255,255,255,.8); color: #000; font-size: 1.4rem; }
  .prev { left: 10px; } .next { right: 10px; }
  .counter { position: absolute; top: 10px; right: 12px; padding: 2px 10px; border-radius: 12px; background: rgba(0,0,0,.6); color: #fff; font-size: .85rem; }
  .pager { display: none; justify-content: center; align-items: center; gap: 12px; margin-top: 12px; }
  .pager.on { display: flex; }
</style>
</head>
<body>
<main>
  <h1>🖼️ Pixabay 이미지 슬라이드</h1>
  <form id="form">
    <input id="apiKey" type="password" placeholder="Pixabay API Key" autocomplete="off" required>
    <input id="query" type="text" placeholder="검색어 (예: 제주 귤, jeju, tangerine)" required>
    <button id="searchBtn" type="submit">검색</button>
  </form>
  <div id="status"></div>

  <div class="slider" id="slider">
    <div class="track" id="track"></div>
    <div class="counter" id="counter"></div>
    <button class="nav prev" id="prev" type="button" aria-label="이전">‹</button>
    <button class="nav next" id="next" type="button" aria-label="다음">›</button>
  </div>

  <div class="pager" id="pager">
    <button id="prevPage" type="button">◀ 이전 10개</button>
    <span id="pageInfo"></span>
    <button id="nextPage" type="button">다음 10개 ▶</button>
  </div>
</main>

<script>
const PER_PAGE = 10;
const $ = id => document.getElementById(id);
let page = 1, total = 0, index = 0, count = 0, lastQuery = "";

// 키는 이 브라우저(localStorage)에만 저장됩니다. 코드/깃에 직접 적지 마세요.
$("apiKey").value = localStorage.getItem("pixabayKey") || "";

$("form").addEventListener("submit", e => {
  e.preventDefault();
  page = 1;
  load();
});
$("prevPage").onclick = () => { if (page > 1) { page--; load(); } };
$("nextPage").onclick = () => { if (page * PER_PAGE < total) { page++; load(); } };
$("prev").onclick = () => go(index - 1);
$("next").onclick = () => go(index + 1);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") go(index - 1);
  if (e.key === "ArrowRight") go(index + 1);
});

async function load() {
  const key = $("apiKey").value.trim();
  const q = $("query").value.trim();
  if (!key || !q) return;
  localStorage.setItem("pixabayKey", key);
  lastQuery = q;

  const url = "https://pixabay.com/api/?" + new URLSearchParams({
    key, q, image_type: "photo", per_page: PER_PAGE, page, lang: "ko", safesearch: "true"
  });

  $("searchBtn").disabled = true;
  $("status").textContent = "불러오는 중...";
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status === 400 ? "API 키 또는 요청이 올바르지 않습니다." : "요청 실패 (" + res.status + ")");
    const data = await res.json();
    total = data.totalHits;
    render(data.hits);
  } catch (err) {
    $("status").textContent = "오류: " + err.message;
  } finally {
    $("searchBtn").disabled = false;
  }
}

function render(hits) {
  const track = $("track");
  track.innerHTML = "";
  count = hits.length;
  if (!count) {
    $("slider").classList.remove("on");
    $("pager").classList.remove("on");
    $("status").textContent = `"${lastQuery}" 검색 결과가 없습니다.`;
    return;
  }
  hits.forEach(h => {
    const s = document.createElement("div");
    s.className = "slide";
    const img = document.createElement("img");
    img.src = h.webformatURL;
    img.alt = h.tags;
    const cap = document.createElement("span");
    cap.textContent = `${h.tags} · by ${h.user}`;
    s.append(img, cap);
    track.append(s);
  });
  $("slider").classList.add("on");
  $("pager").classList.add("on");
  $("status").textContent = `"${lastQuery}" 총 ${total}장 중 ${(page - 1) * PER_PAGE + 1}~${(page - 1) * PER_PAGE + count}번째 (Pixabay 제공)`;
  $("pageInfo").textContent = `${page} / ${Math.ceil(total / PER_PAGE)} 페이지`;
  $("prevPage").disabled = page === 1;
  $("nextPage").disabled = page * PER_PAGE >= total;
  go(0);
}

function go(i) {
  if (!count) return;
  index = (i + count) % count;
  $("track").style.transform = `translateX(-${index * 100}%)`;
  $("counter").textContent = `${index + 1} / ${count}`;
}
</script>
</body>
</html>
